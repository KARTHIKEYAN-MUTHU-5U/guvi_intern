<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FreshFruit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="/">
                <i class="fas fa-apple-alt me-2"></i>FreshFruit
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-5 col-md-7">
                <div class="login-card">
                    <div class="text-center mb-4">
                        <div class="login-icon mb-3">
                            <i class="fas fa-user-circle fa-3x text-success"></i>
                        </div>
                        <h2 class="fw-bold text-success">Welcome Back</h2>
                        <p class="text-muted">Sign in to your FreshFruit account</p>
                    </div>

                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" id="email" class="form-control" required 
                                       placeholder="Enter your email">
                            </div>
                            <div class="form-error" id="emailError"></div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" id="password" class="form-control" required 
                                       placeholder="Enter your password">
                            </div>
                            <div class="form-error" id="passwordError"></div>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 btn-lg mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In
                        </button>
                    </form>
                    
                    <div id="serverError" class="form-error text-center mb-3"></div>
                    
                    <div class="text-center">
                        <p class="text-muted">
                            Don't have an account? 
                            <a href="/register" class="text-success text-decoration-none fw-bold">Create Account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
